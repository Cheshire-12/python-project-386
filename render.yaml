services:
  - type: web
    name: call-calendar
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        value: /app/data/calendar.db
      - key: FRONTEND_DIR
        value: /app/frontend/dist
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
