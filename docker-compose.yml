services:
  flask:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - FLASK_APP=backend.app:create_app
      - DATABASE_URL=/app/data/calendar.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - .:/app
    command: >
      sh -c "pip install --no-cache-dir uv &&
             uv sync &&
             uv run flask run --host 0.0.0.0 --port 8000 --reload"

  vite:
    image: node:18-alpine
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
