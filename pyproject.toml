[project]
name = "call-calendar"
version = "0.1.2"
description = "Календарь звонков"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-cors",
    "gunicorn",
    "jsonschema",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-flask",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
